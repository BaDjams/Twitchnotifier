name: Relevé des drops

on:
  schedule:
    - cron: "7,37 * * * *"   # toutes les 30 min (décalé de :00 pour éviter les bouchons GitHub)
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Envoyer une alerte de test"
        type: boolean
        default: false
  push:
    paths: ["docs/config.json"]   # relevé immédiat quand tu changes tes jeux

permissions:
  contents: write

concurrency:
  group: drops
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TWITCH_TOKEN: ${{ secrets.TWITCH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}
      SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alerte de test
        if: ${{ inputs.test_alert }}
        run: python scripts/check_drops.py --test-alert

      - name: Relever les campagnes
        id: run
        if: ${{ !inputs.test_alert }}
        continue-on-error: true
        run: python scripts/check_drops.py

      - name: Enregistrer les données
        if: ${{ !inputs.test_alert }}
        run: |
          git config user.name "drops-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data state
          if git diff --cached --quiet; then echo "Rien de neuf"; exit 0; fi
          git commit -m "Relevé des drops $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done

      - name: Signaler l'échec
        if: ${{ steps.run.outcome == 'failure' }}
        run: exit 1
